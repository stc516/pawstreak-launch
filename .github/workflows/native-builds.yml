name: Native build validation

on:
  push:
    branches:
      - main
      - 'native/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-readiness:
    name: Native readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate native foundation
        run: npm run qa:native

      - name: Lint
        run: npm run lint

  android-debug:
    name: Android debug APK
    needs: native-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web app
        run: npm run native:sync

      - name: Compile Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pawstreak-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator app
    needs: native-readiness
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web app
        run: npm run native:sync

      - name: Compile unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PawStreakDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: pawstreak-ios-simulator
          path: ${{ runner.temp }}/PawStreakDerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
