name: Beta readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: beta-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Audit, build, and beta QA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Release gate
        run: npm run qa:release

      - name: Build candidate for beta smoke
        run: npm run build

      - name: Run beta-critical smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pawstreak-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:4173 npm run qa:beta-critical

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-readiness-evidence
          path: |
            qa/evidence/release-readiness/**
            qa/evidence/mobile-shell-guard/**
            qa/evidence/beta-critical/**
            /tmp/pawstreak-preview.log
          if-no-files-found: ignore
